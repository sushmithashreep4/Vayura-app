# ============================================================
# VAYURA Backend Configuration
# ============================================================

spring.application.name=vayura-backend
server.port=8080

# ── Database (H2 for development; configure MySQL for production) ──
spring.datasource.url=jdbc:h2:mem:vayura;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── CORS ──
vayura.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── PayPal (Sandbox) ──
# Set via environment variables or override here for local dev
paypal.client.id=${PAYPAL_CLIENT_ID:your_sandbox_client_id}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:your_sandbox_client_secret}
paypal.base.url=https://api-m.sandbox.paypal.com
paypal.sandbox=true

# ── AI Integration ──
# Supports OpenAI-compatible endpoint
ai.api.key=${AI_API_KEY:your_ai_api_key}
ai.api.url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.enabled=${AI_ENABLED:false}

# ── Logging ──
logging.level.com.vayura=INFO
logging.level.org.springframework.web=WARN
# Never log sensitive data
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
